<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anivix">
<meta name="theme-color" content="#000000">
<title>Anivix</title>
<style>
:root{--bg:#F5F5F7;--tile:#FFFFFF;--inset:#F5F5F7;--ink:#1D1D1F;--muted:#6E6E73;--line:#D2D2D7;--accent:#0071E3;--crit:#D70015;--ok:#248A3D;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000000;--tile:#1C1C1E;--inset:#2C2C2E;--ink:#F5F5F7;--muted:#A1A1A6;--line:#3A3A3C;--accent:#0A84FF;--crit:#FF453A;--ok:#30D158;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.tile{background:var(--tile);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.85rem;font-weight:600;color:var(--muted)}
.head span{font-weight:400}
#time{font-size:clamp(2.6rem,13vw,3.6rem);font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
#time small{font-size:.32em;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.muted{color:var(--muted);font-size:.9rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--crit);margin-right:6px}
.dot.on{background:var(--ok)}
.row{background:var(--inset);border-radius:14px;padding:12px 14px;display:flex;gap:12px;min-width:0;text-align:left;border:0;color:inherit;font:inherit;width:100%}
.row .n{font-weight:600;color:var(--muted);min-width:1.3em}
.row .b{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.row .d{font-size:.84rem;font-weight:600}
.row .d.crit{color:var(--crit)}
.row.first{background:var(--accent);color:#fff}
.row.first .t{font-size:1.2rem;letter-spacing:-.02em;line-height:1.2}
.row.first .n,.row.first .s,.row.first .d{color:#fff}
.text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem}
#chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.msg{max-width:88%;padding:9px 13px;border-radius:18px;background:var(--inset);white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start;font-size:.95rem}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff}
.msg.note{background:none;color:var(--muted);font-size:.84rem;padding:2px 4px}
.btn{font:inherit;font-weight:600;border-radius:999px;border:1px solid var(--line);background:none;color:var(--accent);padding:9px 16px;min-height:42px;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
form{display:flex;gap:8px}
input,textarea{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--inset);border:1px solid transparent;border-radius:18px;padding:10px 14px}
textarea{min-height:76px;width:100%}
.btn[aria-pressed=true],.btn.live{background:var(--accent);border-color:var(--accent);color:#fff}
details summary{font-size:.85rem;font-weight:600;color:var(--muted)}
</style>
</head>
<body>
<main>
  <section class="tile">
    <div class="head"><b style="color:var(--ink);font-size:1rem">Anivix</b><span id="status"></span></div>
    <div id="time"></div>
    <div class="muted" id="date"></div>
  </section>
  <section class="tile">
    <div class="head">Assignments, in order <span id="planAt"></span></div>
    <div id="plan" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="muted" id="planFoot"></div>
  </section>
  <section class="tile">
    <div class="head">Ask</div>
    <div id="chat" aria-live="polite"></div>
    <div class="btns" id="quick" hidden><button class="btn primary" id="yes" type="button">Send</button><button class="btn" id="no" type="button">Cancel</button></div>
    <div class="btns" id="voiceRow" hidden><button class="btn" id="mic" type="button">Talk</button><button class="btn" id="wake" type="button" aria-pressed="false">Hey Anivix</button></div>
    <div class="muted" id="voiceNote"></div>
    <form id="askForm"><input id="q" autocomplete="off" placeholder="Ask, or text someone" aria-label="Ask Anivix"><button class="btn primary" type="submit">Send</button></form>
  </section>
  <section class="tile">
    <div class="head">Messages <span id="msgAt"></span></div>
    <div class="text" id="msgs"></div>
    <button class="btn" type="button" id="checkMsgs">Check now</button>
  </section>
  <section class="tile">
    <div class="head">Email <span id="mailAt"></span></div>
    <div class="text" id="mail"></div>
    <button class="btn" type="button" id="checkMail">Check now</button>
  </section>
  <section class="tile">
    <details id="setup">
      <summary>Setup</summary>
      <p class="muted" id="setupNote"></p>
      <textarea id="code" placeholder="Paste the pairing code from your PC" aria-label="Pairing code"></textarea>
      <div class="btns" style="margin-top:8px"><button class="btn primary" type="button" id="pairBtn">Pair</button><button class="btn" type="button" id="unpair">Unpair</button></div>
      <p class="muted">Away from home this app shows names and counts only. Details stay on your PC. What you type in Ask, and the answers, pass through the relay.</p>
    </details>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} }
};
let pair = store.get('anivix-pair'), snap = store.get('anivix-snap'), chat = store.get('anivix-chat') || [], seen = store.get('anivix-seen') || [];
let waiting = false, waitTimer = 0, source = null, online = false;

function decodePair(code){
  try {
    const b = String(code).replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    const p = JSON.parse(atob(b + '='.repeat((4 - b.length % 4) % 4)));
    const ok = t => /^[A-Za-z0-9_-]{1,64}$/.test(t || '');
    if (/^https:\/\/[^\s\/]+$/.test(p.s) && ok(p.i) && ok(p.o) && ok(p.d)) return { s: p.s, i: p.i, o: p.o, d: p.d };
  } catch (e) {}
  return null;
}
/* Only links that open a chat on the phone are allowed through. */
function safeLink(url){
  if (/^sms:[+\d]*\??&body=[^\s"<>]*$/.test(url || '')) return { href: url, label: 'Open in Messages' };
  if (/^https:\/\/wa\.me\/\d*\?text=[^\s"<>]*$/.test(url || '')) return { href: url, label: 'Open in WhatsApp' };
  return null;
}
function ago(secs){
  if (!secs) return '';
  const m = Math.max(0, Math.round((Date.now() / 1000 - secs) / 60));
  return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago';
}
function dueInfo(due){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(due || '')) return { label: 'No due date', crit: false };
  const p = due.split('-').map(Number), t = new Date(); t.setHours(0, 0, 0, 0);
  const days = Math.round((new Date(p[0], p[1] - 1, p[2]) - t) / 864e5);
  if (days < 0) return { label: 'Overdue ' + (-days) + (days === -1 ? ' day' : ' days'), crit: true };
  if (days === 0) return { label: 'Due today', crit: true };
  if (days === 1) return { label: 'Due tomorrow', crit: false };
  return { label: 'Due in ' + days + ' days', crit: false };
}

function renderClock(){
  const d = new Date(), t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }), m = t.match(/^(.*?)(\s?[AP]M)?$/i);
  const box = $('#time'); box.textContent = m[1]; if (m[2]) box.append(el('small', '', m[2].trim()));
  $('#date').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
function renderStatus(){
  const s = $('#status'); s.textContent = '';
  s.append(el('i', 'dot' + (online ? ' on' : '')), document.createTextNode(!pair ? 'Not paired' : online ? 'Connected' : 'Connecting…'));
  $('#setupNote').textContent = pair ? 'Paired with your PC.' : 'On your PC, open phone_links.txt in the Anivix folder, copy the pairing code, and paste it here.';
  $('#unpair').hidden = !pair; if (!pair) $('#setup').open = true;
}
function renderData(){
  const box = $('#plan'); box.textContent = '';
  const plan = (snap && snap.plan) || [];
  if (!plan.length) box.append(el('div', 'muted', snap ? 'Nothing is overdue or due this week.' : 'Waiting for your PC…'));
  plan.forEach((a, i) => {
    const row = el('button', 'row' + (i === 0 ? ' first' : '')), b = el('div', 'b'), d = dueInfo(a.due);
    row.type = 'button'; row.title = 'Ask what this one needs';
    b.append(el('span', 't', a.t), el('span', 's', a.c || ''), el('span', 'd' + (d.crit ? ' crit' : ''), d.label));
    row.append(el('span', 'n', String(i + 1)), b);
    row.onclick = () => send('What do I need to do for ' + a.t);
    box.append(row);
  });
  $('#planAt').textContent = ago(snap && snap.plan_at);
  const extra = snap ? [(snap.more ? snap.more + ' more this week' : ''), (snap.later ? snap.later + ' due later or undated' : '')].filter(Boolean).join(' · ') : '';
  $('#planFoot').textContent = extra + (plan.length ? (extra ? ' · ' : '') + 'Tap one to ask what it needs' : '');
  $('#msgs').textContent = (snap && snap.msgs && snap.msgs.text) || 'Nothing yet.';
  $('#msgAt').textContent = ago(snap && snap.msgs && snap.msgs.at);
  $('#mail').textContent = (snap && snap.email && snap.email.text) || 'Nothing yet.';
  $('#mailAt').textContent = ago(snap && snap.email && snap.email.at);
}
function renderChat(){
  const box = $('#chat'); box.textContent = '';
  if (!chat.length) box.append(el('div', 'msg note', 'Try: “what’s due”, “who messaged me”, “text Dadda I’m on my way”.'));
  chat.forEach(m => {
    const b = el('div', 'msg ' + (m.who === 'me' ? 'me' : m.who === 'note' ? 'note' : 'a'), m.text), link = safeLink(m.click);
    if (link) { const a = el('a', 'btn', link.label); a.href = link.href; a.style.marginTop = '8px'; b.append(document.createElement('br'), a); }
    box.append(b);
  });
  if (waiting) box.append(el('div', 'msg note', 'Working on it…'));
  box.scrollTop = box.scrollHeight;
  const last = chat.filter(m => m.who !== 'note').pop();
  $('#quick').hidden = !(last && last.who === 'a' && /Say send to send it/.test(last.text));
}
function say(entry){ chat.push(entry); chat = chat.slice(-60); store.set('anivix-chat', chat); renderChat(); }
function send(text){
  text = String(text || '').trim(); if (!text) return;
  say({ who: 'me', text: text });
  if (!pair) return say({ who: 'note', text: 'Pair with your PC in Setup first.' });
  waiting = true; renderChat(); clearTimeout(waitTimer);
  waitTimer = setTimeout(() => { if (waiting) { waiting = false; say({ who: 'note', text: 'No answer yet. Your PC may be off or asleep. It will answer when it is back.' }); } }, 180000);
  fetch(pair.s + '/' + pair.i, { method: 'POST', body: 'app:' + text }).then(r => { if (!r.ok) throw new Error('relay'); })
    .catch(() => { waiting = false; clearTimeout(waitTimer); say({ who: 'note', text: 'Couldn’t send. Check your connection and try again.' }); });
}
function onRelay(m){
  if (!m || (m.event && m.event !== 'message') || !m.id || seen.includes(m.id)) return;
  seen.push(m.id); seen = seen.slice(-150); store.set('anivix-seen', seen);
  if (m.topic === pair.d) {
    let s = null; try { s = JSON.parse(m.message); } catch (e) {}
    if (s && typeof s === 'object' && (!snap || (s.at || 0) >= (snap.at || 0))) { snap = s; store.set('anivix-snap', snap); renderData(); }
    return;
  }
  const text = String(m.message || '');
  if (!text || text.startsWith('Still working on it') || text.startsWith('Anivix is online') || m.title === 'Anivix at home') return;
  waiting = false; clearTimeout(waitTimer);
  say({ who: 'a', text: text, click: m.click || '' });
  if (voiceAsk) { voiceAsk = false; speak(text); }
}
function connect(){
  if (source) { source.close(); source = null; }
  online = false; renderStatus();
  if (!pair) return;
  source = new EventSource(pair.s + '/' + pair.o + ',' + pair.d + '/sse?since=3h');
  source.onopen = () => { online = true; renderStatus(); };
  source.onerror = () => { online = false; renderStatus(); };
  source.onmessage = e => { try { onRelay(JSON.parse(e.data)); } catch (err) {} };
}
/* ---------- talking: the Talk button, and "Hey Anivix" while this app is open ---------- */
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, wake = !!store.get('anivix-wake'), armed = false, voiceAsk = false, held = '', holdT = 0, armT = 0, talking = false, micBlocked = false;
function skeleton(ws){
  return ws.join('').replace(/ph/g, 'v').replace(/x/g, 'ks').replace(/ck|q|c/g, 'k').replace(/[fbp]/g, 'v').replace(/m/g, 'n').replace(/z/g, 's')
    .replace(/[^a-z]|[aeiouyhw]/g, '').replace(/(.)\1+/g, '$1');
}
function distance(a, b){
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
/* If the words start with something that sounds like "hey Anivix", returns what was said after it. Otherwise null. */
function afterWake(text){
  const w = text.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
  for (let i = 0; i < Math.min(w.length, 3); i++) {
    if (i > 0 && !/^(hey|hay|hi|he|eh|ok|okay|yo|hello|say|they)$/.test(w[i - 1])) continue;
    for (let n = 3; n >= 1; n--) {
      if (i + n > w.length) continue;
      const sk = skeleton(w.slice(i, i + n));
      if (/^n.*k/.test(sk) && distance(sk, 'nvks') <= (i > 0 ? 1 : 0)) return w.slice(i + n).join(' ');
    }
  }
  return null;
}
function voiceNote(){
  $('#voiceRow').hidden = !Rec; $('#wake').setAttribute('aria-pressed', String(wake)); $('#mic').classList.toggle('live', armed);
  $('#voiceNote').textContent = !Rec ? '' : micBlocked ? 'The microphone is blocked. Allow it for this site in Safari settings.' :
    armed ? (held || 'Listening…') : talking ? 'Speaking…' : wake ? 'Listening for “Hey Anivix” while this app is open.' : '';
}
function speak(text){
  if (!('speechSynthesis' in window)) return;
  stopRec(); talking = true; voiceNote();
  const u = new SpeechSynthesisUtterance(String(text).replace(/https?:\/\/\S+/g, '').replace(/Say send[^\n]*$/, '').slice(0, 700));
  const done = () => { if (!talking) return; talking = false; voiceNote(); if (wake) startRec(); };
  u.onend = u.onerror = done; setTimeout(done, 9000 + u.text.length * 110);
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function flushVoice(){
  clearTimeout(holdT); clearTimeout(armT); const t = held; held = ''; armed = false;
  if (!wake) stopRec();
  if (t) { voiceAsk = true; send(t); }
  voiceNote();
}
function arm(){ armed = true; clearTimeout(armT); armT = setTimeout(() => { if (held) flushVoice(); else { armed = false; if (!wake) stopRec(); voiceNote(); } }, 9000); voiceNote(); }
function startRec(){
  if (!Rec || rec || talking) return;
  const r = rec = new Rec(); r.continuous = true; r.interimResults = true; r.lang = 'en-US';
  r.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i], text = res[0].transcript.trim();
      if (!text) continue;
      if (armed) {                                    /* the request itself: wait for two quiet seconds before sending */
        clearTimeout(holdT); $('#voiceNote').textContent = (held + ' ' + text).trim();
        if (res.isFinal) { held = (held + ' ' + text).trim(); holdT = setTimeout(flushVoice, 2000); }
        continue;
      }
      if (!res.isFinal) continue;
      const rest = afterWake(text);
      if (rest === null) continue;
      arm();
      if (rest.length > 2) { held = rest; holdT = setTimeout(flushVoice, 2000); voiceNote(); }
    }
  };
  r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { micBlocked = true; wake = false; armed = false; store.set('anivix-wake', false); } };
  r.onend = () => { if (rec === r) rec = null; if (held && armed) flushVoice(); if ((wake || armed) && !talking && !micBlocked && !document.hidden) setTimeout(startRec, 500); voiceNote(); };
  try { r.start(); } catch (e) { rec = null; }
  voiceNote();
}
function stopRec(){ if (rec) { const r = rec; rec = null; r.onend = null; try { r.abort(); } catch (e) {} } }
/* The phone only lets a page speak after you have tapped something, so each button also "unlocks" the voice. */
function unlockVoice(){ try { speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); } catch (e) {} }
$('#mic').onclick = () => { unlockVoice(); micBlocked = false; if (armed) return flushVoice(); held = ''; stopRec(); arm(); startRec(); };
$('#wake').onclick = () => { unlockVoice(); micBlocked = false; wake = !wake; store.set('anivix-wake', wake); if (wake) startRec(); else { armed = false; stopRec(); } voiceNote(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) stopRec(); else if (wake) startRec(); });
voiceNote();

$('#askForm').onsubmit = e => { e.preventDefault(); send($('#q').value); $('#q').value = ''; };
$('#yes').onclick = () => send('send');
$('#no').onclick = () => send('cancel');
$('#checkMsgs').onclick = () => send('Who messaged me?');
$('#checkMail').onclick = () => send('Check my email');
$('#pairBtn').onclick = () => {
  const p = decodePair($('#code').value);
  if (!p) { $('#setupNote').textContent = 'That code didn’t work. Copy the whole pairing code and try again.'; return; }
  pair = p; store.set('anivix-pair', pair); $('#code').value = ''; $('#setup').open = false; connect(); renderData(); renderChat();
};
$('#unpair').onclick = () => { pair = null; snap = null; chat = []; ['anivix-pair', 'anivix-snap', 'anivix-chat', 'anivix-seen'].forEach(store.del); connect(); renderData(); renderChat(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && pair && !online) connect(); });
setInterval(renderClock, 1000); setInterval(renderData, 60000);
renderClock(); renderData(); renderChat(); connect();
</script>
</body>
</html>
